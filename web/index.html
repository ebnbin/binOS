<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- 正式版在 Cloudflare Access 后面，manifest 默认不带 cookie 去取会被拦下 -->
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <meta name="apple-mobile-web-app-title" content="binOS" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!-- 屏幕四周是纯黑的外框，系统状态栏和浏览器标题栏也是黑色。
         iOS 26 起不看 theme-color：装成 app 后用默认样式时状态栏固定是白的。所以让页面画到状态栏下面，
         状态栏的颜色由盖住顶边的固定定位元素决定，见 Shell.module.css -->
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>binOS</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
